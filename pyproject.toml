[project]
name = "bartleby-core"
# From the release tag, vX.Y.Z, through hatch-vcs ([tool.hatch.version]; docs/UPSTREAM.md).
dynamic = ["version"]
description = "What every Bartleby product shares: accounts, launch profiles, strategies, the client runtime and its widgets"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "keyring>=25.0",
    # Reads Steam's library folders to find the game (shared/game_install.py).
    "vdf>=3.4",
]

[project.optional-dependencies]
# The client runtime: hooking, launching, movement, the arbiter and the actions. No Qt.
runtime = [
    "wizwalker",
    "wizsprinter",
    # Walks a client's memory regions (runtime/clients/heap_scan.py). wizwalker brings it, but we import it.
    "pymem>=1.13",
    # A zone's grid, its patrol costs and straightening a route are array work (runtime/movement/route.py).
    "numpy>=2.0",
]
# Theming and the widgets the products share.
qt = [
    "PyQt6>=6.9",
    # The player card copies a value to the clipboard (qt/sidebar/player_card.py).
    "pyperclip>=1.8",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-xdist>=3.6",
    "pytest-qt>=4.5.0",
    "ruff>=0.15",
    # tools/dump_realm_names.py reads Root.wad with it. Nothing in bartleby/ reads a WAD.
    "katsuba>=0.4.0",
    # qt/logo/export.py writes the .ico with it, for a product tool. The app never imports that module.
    "pillow>=11.0",
    "pytest-rerunfailures>=16.7",
]

# Ours, pinned by exact commit, the same pins BartleBot carries (its docs/UPSTREAM.md).
[tool.uv.sources]
wizwalker = { git = "https://github.com/BartleWorks/wizwalker.git", rev = "ed97af1a8d91cd74afcbccd81ae2afd10dc742f4" }
wizsprinter = { git = "https://github.com/BartleWorks/wizsprinter.git", rev = "5d5bd4c54654c1c57492789665fe2b58569c13fd" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
qt_api = "pyqt6"
asyncio_default_fixture_loop_scope = "function"
tmp_path_retention_policy = "failed"

[tool.ruff]
extend-exclude = ["*.md"]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501", "E402", "B905", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version is the nearest release tag, vX.Y.Z, and only that: the old bartlebot-pin-YYYYMMDD
# tags would otherwise read as version YYYYMMDD. A commit past the tag, or a tree with edits,
# builds as the next patch's .devN (0.2.1.dev3+g1a2b3c4). The fallback is for a copy with no git history at all.
[tool.hatch.version]
source = "vcs"
tag-pattern = '^v(?P<version>\d+\.\d+\.\d+)$'
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*.[0-9]*.[0-9]*"]

# Rebuild the version when the commit or the tags change, for a product that takes core by path.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.wheel]
packages = ["bartleby"]
