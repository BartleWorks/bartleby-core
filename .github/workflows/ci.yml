name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    # Windows, as BartleBot's CI is: the window and process code under test is Win32.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # --locked fails the run if pyproject.toml was edited without relocking. Every extra,
      # since the suite covers the runtime and Qt tiers as well as the shared one.
      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Test
        run: uv run pytest -n auto
